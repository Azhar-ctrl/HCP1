<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Harishchandrapur-I Dev. Block</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #fdf5e6;
      padding: 30px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 1100px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }

    /* Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    .title-area h2 {
      color: #d9531e;
      font-size: 26px;
      font-weight: 700;
    }

    .title-area p {
      color: #6c757d;
      font-size: 14px;
      margin-top: 3px;
    }

    .btn-add {
      background-color: #d9531e;
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-add:hover {
      background-color: #c44719;
    }

    .divider {
      height: 2px;
      background-color: #d9531e;
      margin-bottom: 25px;
    }

    /* Data Table */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #d9531e;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #eeeeee;
      font-size: 14px;
      color: #333;
      vertical-align: middle;
    }

    .pin-badge {
      background-color: #fff2e6;
      color: #d9531e;
      border: 1px solid #ffd8c2;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      border: none;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-edit { background-color: #f1c40f; color: #333; }
    .btn-send { background-color: #e67e22; }
    .btn-delete { background-color: #e74c3c; }

    .btn-action:hover { opacity: 0.9; }

    /* Footer */
    .dashboard-footer {
      background-color: #d9531e;
      color: #ffffff;
      text-align: center;
      padding: 30px 15px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.6;
    }

    #status {
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Dashboard Header -->
    <div class="dashboard-header">
      <div class="title-area">
        <h2>Admin Dashboard</h2>
        <p>Harishchandrapur-I Development Block, Malda</p>
      </div>
      <button class="btn-add" onclick="addUserPrompt()"><i class="fa-solid fa-plus"></i> Add New User</button>
    </div>

    <div class="divider"></div>

    <p id="status"></p>

    <!-- Users Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Mobile Number</th>
            <th>Designation</th>
            <th>Secret PIN</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="5" style="text-align: center;">Loading users from GitHub...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Dashboard Footer -->
    <div class="dashboard-footer">
      <strong>Harishchandrapur-I Development Block</strong> | Government of West Bengal<br>
      © 2026 All Rights Reserved.
    </div>
  </div>

  <script>
    // Configuration - Replace with your GitHub Repository Details
    const GITHUB_USERNAME = 'YOUR_GITHUB_USERNAME';
    const REPO_NAME = 'YOUR_REPOSITORY_NAME';
    const FILE_PATH = 'users.json';
    const TOKEN = 'YOUR_PERSONAL_ACCESS_TOKEN'; // GitHub Fine-Grained PAT with contents write permission

    const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

    let currentFileSha = '';
    let usersList = [];

    // Load users on initial page load
    document.addEventListener('DOMContentLoaded', fetchUsersFromGitHub);

    // 1. READ: Fetch users list from GitHub
    async function fetchUsersFromGitHub() {
      const status = document.getElementById('status');
      status.style.color = '#333';
      status.textContent = 'Fetching data...';

      try {
        const response = await fetch(GITHUB_API_URL, {
          headers: {
            'Authorization': `token ${TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) throw new Error('Could not load data from GitHub');

        const data = await response.json();
        currentFileSha = data.sha; // Save SHA needed for updating

        // Decode UTF-8 Base64 string from GitHub API response
        const jsonContent = new TextDecoder().decode(
          Uint8Array.from(atob(data.content), c => c.charCodeAt(0))
        );

        usersList = JSON.parse(jsonContent);
        renderTable();
        status.textContent = '';
      } catch (err) {
        status.style.color = 'red';
        status.textContent = 'Error: ' + err.message;
      }
    }

    // 2. Render HTML Table
    function renderTable() {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';

      if (usersList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No users found.</td></tr>';
        return;
      }

      usersList.forEach((user, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${user.name}</strong></td>
          <td>${user.mobile}</td>
          <td style="color:#a6a6a6;">${user.designation || 'N/A'}</td>
          <td><span class="pin-badge">${user.pin}</span></td>
          <td>
            <div class="action-btns">
              <button class="btn-action btn-edit" onclick="editUser(${index})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
              <button class="btn-action btn-send" onclick="sendPin('${user.mobile}')"><i class="fa-solid fa-paper-plane"></i> Send PIN</button>
              <button class="btn-action btn-delete" onclick="deleteUser(${index})"><i class="fa-solid fa-trash"></i> Delete</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 3. WRITE: Save updated users list back to GitHub
    async function saveToGitHub(commitMessage) {
      const status = document.getElementById('status');
      status.style.color = '#333';
      status.textContent = 'Saving changes to GitHub...';

      // Encode UTF-8 content to Base64
      const jsonString = JSON.stringify(usersList, null, 2);
      const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

      try {
        const response = await fetch(GITHUB_API_URL, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${TOKEN}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: commitMessage,
            content: contentBase64,
            sha: currentFileSha
          })
        });

        if (!response.ok) throw new Error('Failed to commit update to GitHub.');

        const responseData = await response.json();
        currentFileSha = responseData.content.sha; // Update SHA to match latest commit
        
        status.style.color = 'green';
        status.textContent = 'Successfully saved to GitHub!';
        renderTable();
      } catch (err) {
        status.style.color = 'red';
        status.textContent = 'Error saving to GitHub: ' + err.message;
      }
    }

    // CREATE: Add new user
    function addUserPrompt() {
      const name = prompt('Enter Full Name:');
      if (!name) return;
      const mobile = prompt('Enter Mobile Number:');
      if (!mobile) return;
      const designation = prompt('Enter Designation (optional):') || 'N/A';
      const pin = prompt('Enter Secret PIN:') || '1234';

      const newUser = { id: Date.now(), name, mobile, designation, pin };
      usersList.push(newUser);

      saveToGitHub(`Add user ${name}`);
    }

    // EDIT: Update existing user
    function editUser(index) {
      const user = usersList[index];
      const newName = prompt('Update Name:', user.name);
      if (!newName) return;
      const newMobile = prompt('Update Mobile Number:', user.mobile);
      if (!newMobile) return;
      const newDesignation = prompt('Update Designation:', user.designation);
      const newPin = prompt('Update PIN:', user.pin);

      usersList[index] = {
        ...user,
        name: newName,
        mobile: newMobile,
        designation: newDesignation || 'N/A',
        pin: newPin || 'N/A'
      };

      saveToGitHub(`Updated user details for ${newName}`);
    }

    // DELETE: Delete user
    function deleteUser(index) {
      const user = usersList[index];
      if (confirm(`Are you sure you want to delete ${user.name}?`)) {
        usersList.splice(index, 1);
        saveToGitHub(`Deleted user ${user.name}`);
      }
    }

    function sendPin(mobile) {
      alert(`Sending SMS PIN to ${mobile}...`);
    }
  </script>
</body>
</html>
