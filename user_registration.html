<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New User Registration</title>
  <!-- Font Awesome for Form Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .card h2 {
      color: #d9531e;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card p.subtitle {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }

    .input-group .icon {
      background-color: #d9531e;
      color: #ffffff;
      width: 50px;
      height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .input-group input {
      width: 100%;
      height: 42px;
      border: none;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      color: #333;
    }

    .input-group input::placeholder {
      color: #888888;
    }

    .btn-register {
      width: 100%;
      height: 42px;
      background-color: #d9531e;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      margin-bottom: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Active button styling when fields are valid */
    .btn-register.active {
      background-color: #d9531e;
      color: #ffffff;
    }

    .login-link {
      font-size: 15px;
      color: #333333;
    }

    .login-link a {
      color: #6f42c1;
      text-decoration: underline;
      font-weight: 500;
    }

    .status-msg {
      margin-top: 15px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>New User Registration</h2>
    <p class="subtitle">Harishchandrapur-I Dev. Block</p>

    <form id="registrationForm">
      <!-- Full Name -->
      <div class="input-group">
        <div class="icon"><i class="fa-solid fa-user"></i></div>
        <input type="text" id="fullName" placeholder="Enter Full Name" required>
      </div>

      <!-- Mobile Number -->
      <div class="input-group">
        <div class="icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
        <input type="tel" id="mobile" placeholder="Enter 10-digit Mobile Number" pattern="[0-9]{10}" maxlength="10" required>
      </div>

      <!-- Secret Pin -->
      <div class="input-group">
        <div class="icon"><i class="fa-solid fa-key"></i></div>
        <input type="password" id="pin" placeholder="Create Secret Pin" required>
      </div>

      <!-- Confirm Pin -->
      <div class="input-group">
        <div class="icon"><i class="fa-solid fa-lock"></i></div>
        <input type="password" id="confirmPin" placeholder="Confirm Secret Pin" required>
      </div>

      <!-- Register Button -->
      <button type="submit" id="registerBtn" class="btn-register">Register</button>
    </form>

    <div class="login-link">
      Already Registered? <a href="#">Login Here</a>
    </div>

    <p id="statusMsg" class="status-msg"></p>
  </div>

  <script>
    // GitHub API Configuration
    const GITHUB_USERNAME = 'YOUR_GITHUB_USERNAME';
    const REPO_NAME = 'YOUR_REPOSITORY_NAME';
    const FILE_PATH = 'data.json'; // Path inside your repository
    const TOKEN = 'YOUR_PERSONAL_ACCESS_TOKEN'; // Replace with your token

    const form = document.getElementById('registrationForm');
    const registerBtn = document.getElementById('registerBtn');
    const statusMsg = document.getElementById('statusMsg');

    // Simple script to toggle register button state when inputs are typed
    form.addEventListener('input', () => {
      const inputs = form.querySelectorAll('input');
      let allFilled = true;
      inputs.forEach(input => {
        if (!input.value.trim()) allFilled = false;
      });

      if (allFilled) {
        registerBtn.classList.add('active');
      } else {
        registerBtn.classList.remove('active');
      }
    });

    // Form Submission Handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const pin = document.getElementById('pin').value;
      const confirmPin = document.getElementById('confirmPin').value;

      if (pin !== confirmPin) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Secret Pins do not match!';
        return;
      }

      statusMsg.style.color = '#333';
      statusMsg.textContent = 'Saving data to GitHub...';

      const newUser = {
        fullName,
        mobile,
        pin, // In production, never save plain text passwords/PINs
        createdAt: new Date().toISOString()
      };

      try {
        await saveToGitHub(newUser);
        statusMsg.style.color = 'green';
        statusMsg.textContent = 'User registered successfully!';
        form.reset();
        registerBtn.classList.remove('active');
      } catch (err) {
        console.error(err);
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Error saving data to GitHub: ' + err.message;
      }
    });

    // Function to fetch existing data, append new user, and commit back to GitHub
    async function saveToGitHub(userData) {
      const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

      // 1. Fetch current file content and SHA
      const getResponse = await fetch(url, {
        headers: {
          'Authorization': `token ${TOKEN}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (!getResponse.ok) {
        throw new Error('Failed to fetch file from GitHub.');
      }

      const fileData = await getResponse.json();
      
      // Decode content from Base64
      const existingContent = JSON.parse(atob(fileData.content));

      // Append new record
      existingContent.push(userData);

      // Encode back to Base64
      const updatedContentBase64 = btoa(JSON.stringify(existingContent, null, 2));

      // 2. Commit updated file to GitHub
      const putResponse = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${TOKEN}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          message: `Add user ${userData.fullName}`,
          content: updatedContentBase64,
          sha: fileData.sha // Required by GitHub API to update an existing file
        })
      });

      if (!putResponse.ok) {
        throw new Error('Failed to write data to GitHub.');
      }
    }
  </script>
  
</body>
</html>
